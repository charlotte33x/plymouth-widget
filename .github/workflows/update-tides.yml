name: Update Tide Data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests arrow

      - run: python update_tides.py
        env:
           STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
           ADMIRALTY_API_KEY: ${{ secrets.ADMIRALTY_API_KEY }}

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/tides.json
          git commit -m "Update tides" || exit 0
          git push
